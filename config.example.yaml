# Copy to ~/dockers/myrun/config.yaml (or point MYRUN_CONFIG at your copy).
# Only strava_db is required. Unknown keys are an error.

strava_db: /path/to/statistics-for-strava/storage/database/strava.db
cache_dir: ~/.cache/myrun            # derived data only; safe to delete

inputs:                               # each is optional; leave out what you do not have
  wellness_parquet:                   # columns: date, readiness, sleep_hours, hrv_ms, resting_hr,
                                      #   body_battery, stress
  plan_csv:                           # columns: date, session, type, distance_km
  race_log_csv:                       # your own columns, mapped below
  garmin_activities:                  # .csv or .parquet. Required column: start (local time).
                                      #   Optional: garmin_activity_id, session_name,
                                      #   session_type, ground_contact_ms,
                                      #   vertical_oscillation_cm, vertical_ratio_pct,
                                      #   stride_length_m, garmin_cadence_spm, power_w,
                                      #   aerobic_te, anaerobic_te, garmin_load, vo2max

race_log_columns:                     # field: header in your CSV. name and date are required.
  name: name
  date: date
  type: type                          # road, trail or mixed
  distance_km: distance_km
  official_time: official_time        # HH:MM:SS
  rank_pct: rank_pct
  garmin_url: garmin_url
race_log_date_format: "%d/%m/%Y"

wellness_columns:                     # only if your file uses other names. field: your column
  # date: local_date
  # readiness: readiness_score
  # hrv_ms: hrv_last_night_ms
  # resting_hr: resting_hr
  # sleep_seconds: sleep_s            # converted to sleep_hours
  # body_battery: body_battery_wake
  # stress: stress_avg
  # sleep_score: sleep_score          # the next four are shown as detail on the
  # deep_sleep_seconds: deep_sleep_s  #   Sleep and HRV cards
  # rem_sleep_seconds: rem_sleep_s
  # hrv_status: hrv_status

links:
  statistics_for_strava_url: http://localhost:8080

hr:                                   # all optional. With nothing set, the maximum heart rate
                                      # is taken from your runs of the last 12 months and the
                                      # zones are 60/70/80/90 % of it.
  # max_hr: 180                       # your maximum heart rate, if you know it
  # zone_upper_bounds: [125, 145, 160, 172]   # upper bpm of zones 1 to 4; overrides max_hr
  # easy_band: [125, 148]             # average HR that counts as an easy run

thresholds:
  # mixed_hilliness_m_per_km: 15    # label a Run that climbs this much per km as "mixed"
  efficiency_max_hilliness_m_per_km: 20
  grade_class_m_per_km: 20
  load_bands: [0.8, 1.3, 1.5]
  stale_hours: 36
  garmin_join_tolerance_s: 120
