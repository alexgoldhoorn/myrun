# Copy to ~/dockers/myrun/config.yaml (or point MYRUN_CONFIG at your copy).
# Only strava_db is required. Unknown keys are an error.

strava_db: /path/to/statistics-for-strava/storage/database/strava.db
cache_dir: ~/.cache/myrun            # derived data only; safe to delete

inputs:                               # each is optional; leave out what you do not have
  wellness_parquet:                   # columns: date, readiness, sleep_hours, hrv_ms, resting_hr
  plan_csv:                           # columns: date, session, type, distance_km
  race_log_csv:                       # your own columns, mapped below
  garmin_activities_parquet:          # columns: start, garmin_activity_id, session_name,
                                      #   session_type, vertical_oscillation_cm,
                                      #   ground_contact_ms, stride_length_m

race_log_columns:                     # field: header in your CSV. name and date are required.
  name: name
  date: date
  type: type                          # road, trail or mixed
  distance_km: distance_km
  official_time: official_time        # HH:MM:SS
  rank_pct: rank_pct
  garmin_url: garmin_url
race_log_date_format: "%d/%m/%Y"

links:
  statistics_for_strava_url: http://localhost:8080

hr:
  zone_upper_bounds: [125, 145, 160, 172]   # upper bpm of zones 1 to 4; zone 5 is above
  easy_band: [125, 148]                     # average HR that counts as an easy run

thresholds:
  mixed_hilliness_m_per_km: 15
  efficiency_max_hilliness_m_per_km: 10
  grade_class_m_per_km: 20
  load_bands: [0.8, 1.3, 1.5]
  stale_hours: 36
  garmin_join_tolerance_s: 120
