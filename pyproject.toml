[project]
name = "myrun"
version = "0.1.0"
description = "A personal training dashboard on top of a statistics-for-strava database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<4",
    "pyarrow>=17",
    "pyyaml>=6",
    "zstandard>=0.23",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
